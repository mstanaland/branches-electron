appId: com.branches.app
productName: Branches
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,mts,cjs}'
  - '!{.oxlintrc.json,.oxfmtrc.json,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,pnpm-workspace.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
mac:
  # Icon Composer file: electron-builder compiles it with actool (Xcode 26+) into the Liquid
  # Glass Assets.car plus an icon.icns fallback for older macOS.
  icon: Branches.icon
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
